name: sponsorenlauf_app
description: "Sponsorenlauf App"
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Utils
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.2.3

  # Firebase (Versionen ungebunden -> löst kompatible letzte Versionen)
  firebase_core:
  firebase_auth:
  cloud_firestore:
  firebase_storage:
  firebase_app_check:

  # Bilder / Editor
  image_picker: ^1.1.2
  image: ^4.5.4
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Extended Image + Editor (wichtig für deinen Avatar-Editor)
  extended_image: ^8.2.1
  extended_image_library:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/